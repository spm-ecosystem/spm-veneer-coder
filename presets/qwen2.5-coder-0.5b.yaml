description: "Qwen2.5-Coder 0.5B — small model, fast training, good for quick iteration"
output_root: outputs
output_dir: outputs/qwen2.5-coder-0.5b/v1

model:
  repository: "unsloth/Qwen2.5-Coder-0.5B-Instruct"

model_load:
  max_seq_length: 4096
  load_in_4bit: true

strategy:
  type: "lora"
  parameters:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    bias: "none"
    use_gradient_checkpointing: "unsloth"

dataset:
  path: "in"
  format: "composite"
  mapping:
    subsets:
      - path: "veneer-spec-reference.md"
        format: "spec-doc"
        mapping:
          language_name: "Veneer Spec (.vnr)"
          compiler_name: "spm-cli"
          output_format: "manifest.json"
          code_language: "vnr"
          skip_headings:
            - "17."
            - "17. Common Errors, Anti-Patterns & Fixes"
      - path: "dataset"
        format: "markdown"

backend:
  name: "unsloth"

hyperparameters:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5
  num_train_epochs: 3
  learning_rate: 0.0002
  logging_steps: 1
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 3407
