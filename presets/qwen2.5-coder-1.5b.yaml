description: "Qwen2.5-Coder 1.5B — moderate size, fast training, excellent balance of speed and reasoning"
output_root: outputs
output_dir: outputs/qwen2.5-coder-1.5b/v1

model:
  repository: "unsloth/Qwen2.5-Coder-1.5B-Instruct"

model_load:
  max_seq_length: 4096
  load_in_4bit: true

strategy:
  type: "lora"
  parameters:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    bias: "none"
    use_gradient_checkpointing: "unsloth"

dataset:
  path: "in"
  format: "composite"
  mapping:
    subsets:
      - path: "veneer-spec-reference.md"
        format: "spec-doc"
        mapping:
          language_name: "Veneer Spec (.vnr)"
          compiler_name: "spm-cli"
          output_format: "manifest.json"
          code_language: "vnr"
