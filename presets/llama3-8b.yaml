description: "Llama-3 8B (4bit) — larger model, more capacity, slower training"
output_root: outputs
output_dir: outputs/llama3-8b/v1

model:
  repository: "unsloth/llama-3-8b-Instruct-bnb-4bit"

model_load:
  max_seq_length: 1024
  load_in_4bit: true

strategy:
  type: "lora"
  parameters:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    bias: "none"
    use_gradient_checkpointing: "unsloth"

dataset:
  path: "in"
  format: "veneer-composite"
  mapping:
    messages: "messages"

backend:
  name: "unsloth"

hyperparameters:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5
  max_steps: 100
  learning_rate: 0.0002
  logging_steps: 1
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 3407
