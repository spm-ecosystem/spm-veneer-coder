description: "Llama-3 8B (4bit) — larger model, more capacity, slower training"
output_root: outputs
output_dir: outputs/llama3-8b/v1

model:
  repository: "unsloth/llama-3-8b-Instruct-bnb-4bit"

model_load:
  max_seq_length: 1024
  load_in_4bit: true

strategy:
  type: "lora"
  parameters:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    bias: "none"
    use_gradient_checkpointing: "unsloth"

dataset:
  path: "in"
  format: "composite"
  mapping:
    subsets:
      - path: "veneer-spec-reference.md"
        format: "spec-doc"
        mapping:
          language_name: "Veneer Spec (.vnr)"
          compiler_name: "spm-cli"
          output_format: "manifest.json"
          code_language: "vnr"
